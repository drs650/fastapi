<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}우리집 책장{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <!-- 모든 화면에서 공통으로 보이는 상단 메뉴 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a href="#" class="navbar-brand">우리집 책장</a>
            <div class="navbar-nav">
                <a href="/shelf" class="nav-link">서재 보기</a>
                <a href="/ui/books/lookup" class="nav-link">ISBN 조회 등록</a>
                <a href="/ui/books/register" class="nav-link">표지 사진 등록</a>
            </div>
        </div>
    </nav>

    <!-- 자식 템플릿이 실제 화면 내용을 채워넣는 곳 -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
